<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="960" height="400" fill="#ffffff"/>
  <text x="24" y="32" font-size="20" font-weight="bold" fill="#1d1d1f">적 수에 따른 성능 (Release, 적이 몰린 장면, 자동 벤치마크 CSV)</text>

  <!-- legend -->
  <g font-size="13">
    <line x1="24" y1="56" x2="54" y2="56" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="6 4"/><text x="60" y="61">전체 순회 (처음)</text>
    <line x1="200" y1="56" x2="230" y2="56" stroke="#e08a2a" stroke-width="3"/><text x="236" y="61">+ Spatial Hash</text>
    <line x1="370" y1="56" x2="400" y2="56" stroke="#2b5797" stroke-width="3"/><text x="406" y="61">+ 미니맵 점·화면 밖 그리기 생략</text>
  </g>

  <!-- panel 1: FPS -->
  <text x="70" y="82" font-size="14" font-weight="bold">FPS (높을수록 좋음, 60 상한)</text>
  <g stroke="#e6e8ec" stroke-width="1">
    <line x1="70" y1="121.4" x2="450" y2="121.4"/><line x1="70" y1="184.3" x2="450" y2="184.3"/><line x1="70" y1="247.1" x2="450" y2="247.1"/>
  </g>
  <line x1="70" y1="310" x2="450" y2="310" stroke="#5b6270"/><line x1="70" y1="90" x2="70" y2="310" stroke="#5b6270"/>
  <g font-size="11" fill="#555" text-anchor="end">
    <text x="64" y="125">60</text><text x="64" y="188">40</text><text x="64" y="251">20</text><text x="64" y="314">0</text>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="70" y="326">0</text><text x="146" y="326">2,000</text><text x="222" y="326">4,000</text><text x="298" y="326">6,000</text><text x="374" y="326">8,000</text><text x="450" y="326">10,000</text>
    <text x="260" y="344">적 수</text>
  </g>
  <polyline fill="none" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="6 4" points="89.0,121.4 108.0,121.4 146.0,121.4 184.0,121.7 222.0,156.9 260.0,202.7 298.0,231.5"/>
  <polyline fill="none" stroke="#e08a2a" stroke-width="3" points="89.0,121.4 108.0,121.6 146.0,121.4 184.0,121.4 222.0,127.4 260.0,171.3 298.0,196.0"/>
  <polyline fill="none" stroke="#2b5797" stroke-width="3" points="89.0,121.4 108.0,121.4 146.0,121.4 184.0,121.4 222.0,121.4 260.0,121.4 298.0,121.4 374.0,121.4 446.2,125.6"/>
  <g font-size="12" font-weight="bold">
    <text x="304" y="236" fill="#6b7280">25.0</text>
    <text x="304" y="200" fill="#b0601a">36.3</text>
    <text x="400" y="114" fill="#2b5797">9,900마리 58.7</text>
  </g>

  <!-- panel 2: logic ms per tick -->
  <text x="540" y="82" font-size="14" font-weight="bold">틱당 로직 시간 ms (낮을수록 좋음)</text>
  <g stroke="#e6e8ec" stroke-width="1">
    <line x1="540" y1="90" x2="920" y2="90"/><line x1="540" y1="163.3" x2="920" y2="163.3"/><line x1="540" y1="236.7" x2="920" y2="236.7"/>
  </g>
  <line x1="540" y1="310" x2="920" y2="310" stroke="#5b6270"/><line x1="540" y1="90" x2="540" y2="310" stroke="#5b6270"/>
  <g font-size="11" fill="#555" text-anchor="end">
    <text x="534" y="94">9</text><text x="534" y="167">6</text><text x="534" y="240">3</text><text x="534" y="314">0</text>
  </g>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="540" y="326">0</text><text x="616" y="326">2,000</text><text x="692" y="326">4,000</text><text x="768" y="326">6,000</text><text x="844" y="326">8,000</text><text x="920" y="326">10,000</text>
    <text x="730" y="344">적 수</text>
  </g>
  <polyline fill="none" stroke="#9aa3b2" stroke-width="3" stroke-dasharray="6 4" points="559.0,301.7 578.0,294.1 616.0,276.2 654.0,248.1 692.0,217.2 730.0,177.8 768.0,138.0"/>
  <polyline fill="none" stroke="#e08a2a" stroke-width="3" points="559.0,304.5 578.0,301.7 616.0,295.6 654.0,283.2 692.0,270.1 730.0,253.6 768.0,236.2"/>
  <polyline fill="none" stroke="#2b5797" stroke-width="3" points="559.0,303.0 578.0,299.9 616.0,291.9 654.0,278.5 692.0,264.4 730.0,243.8 768.0,222.5 844.0,159.5 916.2,113.2"/>
  <g font-size="12" font-weight="bold">
    <text x="774" y="136" fill="#6b7280">7.04</text>
    <text x="774" y="246" fill="#b0601a">3.02</text>
    <text x="852" y="108" fill="#2b5797">8.05</text>
  </g>

  <text x="24" y="372" font-size="12" fill="#555">Spatial Hash로 6,000마리 기준 로직 시간 약 2.3배 감소 (7.04 → 3.02 ms). FPS 60 도달은 렌더 개선(미니맵 점, 화면 밖 그리기 생략)까지 합친 결과.</text>
  <text x="24" y="390" font-size="12" fill="#777">인위적인 스트레스 테스트 결과이며, 원본 CSV: docs/measure/bench_v3_*.csv, bench_v6_*.csv</text>
</svg>
