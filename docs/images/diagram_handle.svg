<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect width="960" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6270"/></marker>
  </defs>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#1d1d1f">World — 고정 슬롯 풀 + 세대 번호 핸들</text>
  <text x="24" y="56" font-size="13" fill="#555">칸은 처음에 한 번 만들고 크기를 바꾸지 않음 (주소 고정) · 외부는 포인터 대신 Handle{칸 번호, 세대}만 보관</text>

  <g font-size="13" text-anchor="middle">
    <text x="60" y="96" fill="#555">칸</text>
    <rect x="100" y="78" width="120" height="70" fill="#eef1f6" stroke="#9aa3b2"/>
    <text x="160" y="104">[0] 플레이어</text><text x="160" y="126" fill="#555">gen 1 · 살아 있음</text>
    <rect x="220" y="78" width="120" height="70" fill="#fff0dc" stroke="#e08a2a" stroke-width="2"/>
    <text x="280" y="104">[1] 새 적</text><text x="280" y="126" fill="#b0601a">gen 2 · 살아 있음</text>
    <rect x="340" y="78" width="120" height="70" fill="#eef1f6" stroke="#9aa3b2"/>
    <text x="400" y="104">[2] 적</text><text x="400" y="126" fill="#555">gen 1 · 살아 있음</text>
    <rect x="460" y="78" width="120" height="70" fill="#f4f4f4" stroke="#c8ccd4" stroke-dasharray="4 3"/>
    <text x="520" y="104" fill="#888">[3] 빈 칸</text><text x="520" y="126" fill="#888">gen 3</text>
    <text x="620" y="118" fill="#888">… 9,999칸</text>
  </g>

  <g font-size="13">
    <rect x="100" y="196" width="230" height="44" rx="6" fill="#fde4e4" stroke="#d05050"/>
    <text x="215" y="223" text-anchor="middle">예전 핸들 {1, gen 1}</text>
    <line x1="250" y1="196" x2="275" y2="152" stroke="#d05050" stroke-width="2" marker-end="url(#a)"/>
    <text x="100" y="262" fill="#b03030">세대 불일치 → Get()이 nullptr (이미 죽은 적)</text>
    <text x="100" y="282" fill="#777">포인터였다면 그 칸에 들어온 새 적을 모르고 건드림</text>

    <rect x="400" y="196" width="230" height="44" rx="6" fill="#e8f4ec" stroke="#5aa070"/>
    <text x="515" y="223" text-anchor="middle">현재 핸들 {1, gen 2}</text>
    <line x1="470" y1="196" x2="300" y2="152" stroke="#5aa070" stroke-width="2" marker-end="url(#a)"/>
    <text x="400" y="262" fill="#2f7a48">세대 일치 → 정상 접근</text>
  </g>

  <rect x="680" y="78" width="256" height="214" rx="8" fill="#f7f7f9" stroke="#c8ccd4"/>
  <text x="808" y="102" font-size="14" font-weight="bold" text-anchor="middle">삭제 규칙</text>
  <g font-size="12" fill="#444">
    <text x="694" y="128">1. 순회 중 Destroy() = 예약만</text>
    <text x="694" y="150">2. 틱 끝 FlushRemovals()에서 일괄</text>
    <text x="708" y="170">· 살아 있음 해제</text>
    <text x="708" y="190">· 세대 +1 → 옛 핸들 전부 무효</text>
    <text x="708" y="210">· 빈 칸 목록에 반납 → 재사용</text>
    <text x="694" y="238">→ 순회 중 컨테이너 삭제 없음</text>
    <text x="694" y="258">→ 생성·삭제 때 메모리 할당 없음</text>
    <text x="694" y="278" fill="#777">(용량 초과는 치명적 오류로 처리)</text>
  </g>
</svg>
